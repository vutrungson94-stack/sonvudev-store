<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title data-i18n="title.order">Đơn hàng — {{brandName}}</title><link rel="preload" as="font" type="font/woff2" href="/fonts/be-vietnam-pro-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/be-vietnam-pro-vietnamese.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-vietnamese.woff2" crossorigin>
<link rel="stylesheet" href="/styles.min.css">
{{iconLinks}}
</head>
<body data-support="{{support}}" data-review-min="{{reviewMinLength}}" data-review-max="{{reviewMaxLength}}">
<!-- This page is where a buyer lands after paying by PayPal and then losing
     their session, so the shell around order.js speaks the same dictionary as
     the storefront. order.js writes the order itself; only the frame is here. -->
<header class="site-header"><a class="brand" href="/">{{brandWordmark}}</a>{{headerNav}}<a class="header-cta" href="/#products"><span data-i18n="nav.buy">Mua ngay</span> <span>↗</span></a></header>
<main class="order-shell wrap">
<p class="eyebrow"><span>✦</span> <span data-i18n="order.eyebrow">Đơn hàng</span></p>
<h1 class="order-title" id="order-title" data-i18n="order.loading">Đang tải…</h1>
<p class="order-lead" id="order-lead"></p>
<div id="order-body" class="order-body"></div>
</main>
<footer class="site-footer wrap"><div class="brand">{{brandWordmark}}</div><p data-i18n="brand.tagline">Phần mềm tốt cho công việc tốt.</p>{{businessContactHtml}}<div class="footer-links">{{footerLinks}}</div><small data-i18n="brand.rights">© {{year}} · Đồng sở hữu</small></footer>
<script defer src="/format.js"></script><script defer src="/i18n.js"></script><script defer src="/order-client.js"></script><script defer src="/order.js"></script><script defer src="/quality.js"></script>
</body></html>
