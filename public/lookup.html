<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tra cứu đơn hàng SonVuDev bằng mã đơn và email đã dùng khi thanh toán."><meta name="robots" content="noindex,follow"><title>Tra cứu đơn hàng — SonVuDev</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body class="lookup-page" data-support="{{support}}">
<main class="lookup-card">
<!-- The copy lives in i18n.js, not here. It used to be typed into this file and
     into lookup.js as well, so the same sentence existed in three places and
     changing one of them changed nothing. Recovery is the one page an overseas
     buyer reaches after a PayPal payment, so it has to follow the language they
     arrived in. -->
<p class="eyebrow"><span>✦</span> <span data-i18n="lookup.eyebrow">Hỗ trợ</span></p>
<h1 data-i18n="lookup.title">Tra cứu đơn hàng</h1>
<p data-i18n="lookup.lead">Nhập mã đơn và email bạn đã dùng khi thanh toán. Chúng tôi sẽ đưa bạn thẳng tới trang tải sản phẩm.</p>
<form id="lookup-form">
<label><span data-i18n="lookup.orderLabel">Mã đơn hàng</span><input name="orderId" required autocomplete="off" placeholder="SVD-XXXXXX-XXXXXX"></label>
<label><span data-i18n="lookup.emailLabel">Email đã thanh toán</span><input name="email" type="email" required autocomplete="email" placeholder="ban@example.com"></label>
<button class="button button-primary" type="submit" id="lookup-submit"><span data-i18n="lookup.submit">Tra cứu đơn hàng</span> <span>→</span></button>
<p class="form-message" id="lookup-status"></p>
</form>
<a class="lookup-back" href="/"><span data-i18n="lookup.back">Về cửa hàng</span> ←</a>
</main>
<script src="i18n.js"></script>
<script src="lookup.js"></script>
</body></html>
