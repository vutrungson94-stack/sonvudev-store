# Runs the checks on every push and pull request.
#
# This exists because the whole project was previously verifiable only by opening a
# terminal on the developer's machine. Everything in this file already ran by hand;
# the change is that it now runs for everyone, every time, and a failure is
# something a pull request cannot merge past.
#
# Three gates, in the order they should fail:
#   1. lint        every file parses
#   2. audit       the rules this project has already been bitten by
#   3. test        the behaviour, including the two that no amount of reading
#                  would have caught: the CSP blocking its own pages, and an
#                  og:image that is not an image most platforms can display
#
# The audit and the tests need APP_URL and SUPPORT_EMAIL to mean anything — the
# audit compares files against those values and refuses to run without them, on
# purpose. They are given fixture values here rather than read from a developer's
# .env, so a fresh clone and this machine run exactly the same checks.
name: checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Two Node versions: what production runs (22) and the current release
    # (24). package.json invites an operator to install either, so both have
    # to pass here rather than on a user's machine. Node 20 was the original
    # floor and was dropped from CI to silence the deprecation warnings;
    # removing it from the matrix is the last gate that still says so.
    #
    # A matrix line lost its indentation once and closed this workflow for
    # every Node version at once: two identical keys at column 0, and GitHub
    # refused to start a run. Keep the eight spaces.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      APP_URL: https://ci-fixture.example
      SUPPORT_EMAIL: support@ci-fixture.example
      BRAND_NAME: SonVuDev
      BRAND_DESCRIPTION: Công cụ và tiện ích phần mềm cho doanh nghiệp và cá nhân tại Việt Nam.
      BANK_BIN: '970436'
      EMAIL_FROM: 'SonVuDev <no-reply@ci-fixture.example>'
      # Secrets are never available to a pull request from a fork, and no check
      # here may reach the network with one. These exist so a stray default can
      # never turn a lint run into a real email or a real IndexNow ping.
      RESEND_API_KEY: ''
      INDEXNOW_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''

    name: node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The lockfile is committed and npm ci is the install. A range in package.json
      # that resolved differently this week than last week is not something a
      # passing build should depend on.
      - name: install
        run: npm ci

      - name: dependency audit
        run: npm audit --audit-level=high

      - name: lint
        run: npm run lint

      - name: audit
        run: npm run audit

      # Case-sensitive imports: Windows không thấy, Linux (CI/deploy) mới chết.
      - name: case
        run: npm run case

      # A workflow that does not parse starts zero jobs: the run ends "failure"
      # with no jobs and no logs to read, which looks exactly like a red build.
      # This is the only gate that reads .github/workflows/ as YAML — the audit
      # reads it as text, and the guard tests regex it, so both stayed green on a
      # file that could not start a job.
      - name: workflows
        run: npm run workflow

      - name: metrics
        run: npm run metrics

      - name: test
        run: npm test

      # The build runs the audit again on purpose: it is what actually ships, and
      # the packaging step is the last moment a missing required file is cheap to
      # notice.
      - name: build
        run: npm run build

      # The build report is written into the job summary rather than uploaded as
      # an artifact, and that is not a convenience choice.
      #
      # GitHub's artifact quota is an account-wide allowance, not a per-repository
      # one. A full bucket anywhere on the account fails this upload with "Artifact
      # storage quota has been hit", and there is nothing in this file that can
      # free it — no amount of trimming this repo's 69 artifacts, which together
      # total 0.3 MB, will help. The result was three red runs on a build that had
      # passed every gate, for a report of three small files.
      #
      # `$GITHUB_STEP_SUMMARY` renders on the run page itself, beside the logs
      # that made you want the report in the first place. Same content, no storage,
      # no quota, no download step. It also removes the temptation this repository
      # already guards against: the two ways a pipeline reports success for work
      # that failed — the YAML flag and the shell fallback — are both banned here,
      # and the guard greps the whole file for them, comments included. A gate that
      # swallows its own failure is worse than a loud one. There is now nothing
      # left to swallow.
      #
      # Still gated to the live branch and one Node version: the report is
      # byte-identical across the three legs, and a pull request has nothing to
      # deploy and so nothing to trace.
      - name: publish build report to the job summary
        if: always() && github.ref == 'refs/heads/main' && matrix.node-version == '24'
        run: |
          {
            echo "### Báo cáo build"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            for f in build-reports/*.json; do
              [ -e "$f" ] || continue
              echo "<details><summary>$(basename "$f")</summary>"
              echo
              echo '```json'
              cat "$f"
              echo '```'
              echo "</details>"
              echo
            done
            echo "### File được đóng gói"
            echo
            echo '```'
            find publish-output/node -type f | sed "s|^publish-output/node/||" | sort | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The live site, checked the way a crawler sees it. Runs after the checks so it
  # never audits a commit that cannot build, and it waits for the deploy to serve
  # this exact commit before scoring anything - before, this job raced the Render
  # deploy and audited the previous release, which is how a correct fix was
  # reported as a failure against it.
  deployed-site:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # Only on the branch that is live. Every other run would report against a URL
    # that is not the one people visit.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The gate: wait until the live host reports serving THIS commit.
      #
      # /api/health answers {"commit": "<sha>"} since the deploy that introduced
      # it. Until then the loop just sees an absent field and keeps waiting.
      # A deploy that never lands is a red gate, not a green one: that is the
      # difference between "verified deploy" and "hopeful email from Render".
      #
      # NOTE: the `secrets` context is NOT available in an `if:` expression
      # (startup failure: "Unrecognized named-value: 'secrets'", 0 jobs run), so
      # the secret is passed via `env` and tested inside `run` instead.
      - name: wait for the deploy to serve this commit
        env:
          CHECK_URL: ${{ secrets.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$CHECK_URL" ]; then
            echo "::error::secrets.APP_URL chua duoc dat, nen bo deploy nay KHONG kiem tra gi ca."
            echo "::error::Dat no trong Settings > Secrets and variables > Actions > Repository secrets, ten APP_URL, gia tri https://<domain-cua-ban>"
            exit 1
          fi
          base="${CHECK_URL%/}"
          found=""
          # 15 minutes. The window was 9, and a deploy that took ten minutes
          # was reported as a failed gate on a site that was serving the new
          # commit two minutes later: the check was measuring Render's queue,
          # not the shop. A deploy that never lands is still a red gate — that
          # is what the 15 minutes are for.
          for i in $(seq 1 90); do
            body="$(curl -s -m 15 "$base/api/health" || echo '')"
            commit="$(printf '%s' "$body" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')"
            if [ "$commit" = "$EXPECTED_SHA" ]; then
              echo "deploy phuc vu dung commit $EXPECTED_SHA"
              found=1
              break
            fi
            if [ -n "$commit" ]; then
              echo "host dang phuc vu $commit; cho $EXPECTED_SHA ... ($i/90)"
            else
              echo "chua doc duoc commit tu /api/health - dang thu lai ($i/90)"
            fi
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "::error::Sau 15 phut, $base van chua phuc vu commit $EXPECTED_SHA."
            echo "::error::Kiem tra tab Environments tren Render, hoac chay 'curl $base/api/health' tren may that."
            exit 1
          fi

      - name: check the live site
        run: npm run seo:check -- "${{ secrets.APP_URL }}"
        env:
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

  # The page, measured the way a shopper's browser sees it.
  #
  # The Lighthouse numbers this project reacted to came from a browser with
  # extensions installed: "unused JavaScript: 443 KB" was the Google Translate
  # extension, and a finding nobody can act on is a finding that teaches people
  # to ignore the report. This job runs headless with extensions disabled and
  # asserts on the site's own numbers — its scores, its metrics, and its own
  # assets. Third-party bytes are reported, never failed on.
  #
  # It measures the PACKAGED ARTIFACT served on localhost, not the live site.
  # A runner on another continent measures the distance to the server as much
  # as it measures the page: the same build scored 100 from the build machine
  # and failed the LCP threshold on the runner, which said nothing about the
  # page and everything about the network. The artifact is the exact bytes
  # deploy/deploy.sh ships, and on localhost the number belongs to the page.
  #
  # The live site is checked by the `deployed-site` job; the two together cover
  # "the page is good" and "the live site is the page".
  lighthouse:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The artifact is not in the repository — publish-output/ is ignored, and
      # every job gets its own checkout. So this job builds it, the same way
      # deploy does, rather than trusting that another job left one behind.
      # (No upload-artifact step: the account-wide artifact quota has already
      # turned this repository's runs red for things that had nothing to do
      # with the build.)
      - name: build the artifact to measure
        run: npm run build

      # Fail here, with the reason, rather than forty seconds later with a
      # generic "the server did not come up". The server imports one file that
      # only exists after a build, and the failure mode of a missing artifact is
      # an ERR_MODULE_NOT_FOUND that says where the file should have been.
      - name: check the artifact is there
        run: |
          set -eu
          if [ ! -f publish-output/node/src/app.js ]; then
            echo "::error::Artifact chua duoc build (publish-output/node/src/app.js khong ton tai) - buoc 'npm run build' o job nay chua tao ra no."
            exit 1
          fi

      - name: measure the packaged artifact
        env:
          # Chrome is preinstalled on the runner; the path is named explicitly so
          # the run does not depend on what chrome-launcher guesses.
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: |
          set -eu
          node scripts/serve-artifact.mjs &
          ready=""
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::artifact server khong len duoc tren cong 4173"
            exit 1
          fi
          npm run lighthouse:check -- http://127.0.0.1:4173/

  # A tag per deploy, which is the only thing the DORA numbers can be computed
  # from.
  #
  # `git tag` was empty in this repository while the DORA report said "0
  # deployments per week, lead time 0 days". The report was not wrong about the
  # repository; it was measuring the absence of releases, because nothing ever
  # recorded one. A release tag is that record: it is created after the live
  # host is confirmed to be serving this commit, so a tag means "this was
  # deployed", not "this was committed".
  release-tag:
    needs: [checks, deployed-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # The one job that writes to the repository. Least privilege: the workflow
    # itself stays read-only, and only this job may push a tag.
    permissions:
      contents: write
    steps:
      # Full history: the lead time is the age of the oldest commit in the
      # range, so a shallow checkout would measure nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: tag the release
        run: |
          set -eu
          tag="v${GITHUB_RUN_NUMBER}.${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release $tag (${GITHUB_SHA})"
          git push origin "$tag"
          echo "tagged $tag"

      - name: record the DORA metrics from the tag
        run: |
          set -eu
          npm run dora:metrics
          {
            echo "### DORA (sau khi gắn tag)"
            echo
            echo '```json'
            cat metrics-dora.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
