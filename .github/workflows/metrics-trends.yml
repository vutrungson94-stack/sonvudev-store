name: metrics-trends

# One real measurement a day, committed to the repository.
#
# The metrics gate compares one run against a committed baseline, which answers
# "did this change make it worse" and nothing else. "Is this week better than
# last week" needs a series, and the series is worth what the snapshots in it
# were measured with. So this measures on a schedule and commits the result, and
# the analysis (slope, acceleration, control limits) runs in scripts/metrics.mjs
# on every one of those runs.
#
# The cadence is daily until the SPC control chart has 25 points (the minimum
# for a stable control limit). At one snapshot a week that took 25 weeks; at one
# a day it takes 25 days. A day with no change produces no commit, so a quiet
# week still costs one commit, not seven. Once 25 points exist, the schedule can
# go back to weekly.
#
# No fixture environment is needed here: the measurement counts lines of source,
# and touches neither the server nor its configuration.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trends:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write access is the point of the job: a snapshot committed nowhere never
    # reaches the next run's analysis.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: measure and analyse
        run: npm run metrics:trends
      - name: L5 measurement modules
        # Five measurement modules had no schedule: their numbers only moved
        # when someone remembered to run them by hand. A metric with no cadence
        # is an anecdote, not a control. The trend job already owns the daily
        # commit, so these run here instead of a second racing cron.
        env:
          # The origin host is configuration, never typed into source; the
          # checkout has no .env, so the cache probe reads the repo secret.
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          npm run spc:check
          npm run defect:check
          npm run sla:check
          npm run postmortem:check
          npm run quality:report
          npm run cache:check
      - name: read Cloudflare token from Render
        # Render holds the one live value; a roll updates it there and GitHub
        # never needs a secret-write PAT. --required makes an empty answer fail
        # the job: an SLO written without a real source is worse than no SLO.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: node scripts/gha-read-cf-token.mjs --required
      - name: Cloudflare edge SLO ingest (30d)
        # One daily edge sample builds the real 30-day window. The ingest keeps
        # the measured coverage span in the evidence, and slo:check writes the
        # SLO file this job commits. An empty Cloudflare answer exits 2 rather
        # than overwriting good evidence with null.
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          npm run slo:ingest:cloudflare:30d
          npm run slo:check
      - name: Cloudflare token expiry guard
        # Warns before the 90-day token silently kills the ingest above.
        run: npm run cf:token:check:30
      - name: commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-*.json
          if git diff --cached --quiet; then
            echo "No new snapshot: nothing moved since the last measurement."
          else
            git commit -m "ci: daily metrics + L5 measurement snapshot"
            git push
          fi
