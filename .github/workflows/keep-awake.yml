# Watches the shop and says so when it stops answering.
#
# This started out as the thing that keeps Render's free instance awake, and it cannot
# be that, so it is worth recording why — otherwise the next person to read it tries
# again, spends an afternoon, and finds out.
#
# Render puts a free instance to sleep after fifteen minutes of inactivity. Nothing in
# the application can prevent that, because an instance that is asleep is not running
# the code that would wake it. So the ping has to come from outside — and the cheapest
# outside looked like this file.
#
# The arithmetic does not work. GitHub rounds every job on a private repository up to a
# whole minute, and private repositories get 2,000 minutes a month free:
#
#   waking needs a ping under 15 minutes  = at least 4,320 jobs a month = 4,320 minutes
#   available on a private repository      = 2,000 minutes
#
# So the budget runs out about halfway through the month and GitHub stops running the
# rest — leaving an instance that sleeps anyway, and a monitor that stopped monitoring
# without saying so. On a public repository Actions are free and this would work; this
# one is private.
#
# Waking is therefore a Cloudflare Worker's job: cloudflare/keep-awake runs once a
# minute on the Workers cron, which is free and has none of GitHub's queue delay.
# That delay is not theoretical — this workflow's own runs were landing three to six
# hours apart, which is longer than Render's fifteen-minute sleep, so at a `*/30`
# cadence it was not keeping anything awake. It only ever appeared to work because
# somebody was visiting the shop.
#
# So this file is the net under that, and the alarm if it stops. Once a day is 30
# jobs a month against the 2,000 minutes above, so the quota stopped being the
# binding constraint; what the daily run buys is that a Worker which has stopped
# firing — deleted, misconfigured, or quietly failing — is noticed within a day
# instead of never.
#
# Keeping both is deliberate. They fail differently: the Worker is Cloudflare's
# scheduler against your account, and this runs from the repository this shop lives
# in. Either one alone leaves a gap; together the gap is small.
#
# To change the address, set the repository variable SHOP_URL rather than editing this
# file — a domain change is then one edit, and the check that watches the shop is
# watching the shop.
#
# The mapping below is what makes that sentence true, and it was missing. SHOP_URL in
# the run step is a *shell* variable: GitHub Actions puts repository variables into a
# step's environment only when something declares them there. With no `env:` block the
# shell never saw SHOP_URL, the `${SHOP_URL:-...}` default won every single run, and
# setting the repository variable did nothing at all — while the comment above
# promised exactly that it would work.
#
# A test asserted that the string "SHOP_URL" appears in this file, which the broken
# version satisfied. The monitor that watches whether the shop is alive was pointed at
# last year's host, reported on it faithfully, and had been untouchable by
# configuration for its whole life. Declaring the variable here is the whole fix.

name: shop is awake

on:
  schedule:
    # Once a day. GitHub cron is UTC and this is 05:00 UTC — 12:00 in the shop's own
    # timezone (ICT, UTC+7, which is what cloudflare/keep-awake/worker.js reasons
    # about with its own ICT_OFFSET_HOURS). The two run on different clocks and the
    # comment used to imply they agreed; they do not, and the daily probe is a
    # fire alarm rather than a morning checkup, so the hour it lands on does not
    # matter. If it ever does matter, the fix is to say which timezone is meant here.
    #
    # Every thirty minutes spent 1,440 of the 2,000 free minutes on a private
    # repository duplicating a worker Cloudflare runs for free — see the note above for
    # why that cadence never worked anyway.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: shop-awake
  cancel-in-progress: false

jobs:
  check:
    # No secrets, and deliberately none available: the health endpoint is public, and
    # a schedule that could read ADMIN_API_TOKEN is a schedule that could refund
    # orders.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # No default on purpose. The run step carries a fallback for the case where this
      # is empty, and that fallback is the address the shop had when this workflow was
      # written. Naming it here too would mean two places to change, which is the thing
      # this file exists to avoid.
      SHOP_URL: ${{ vars.SHOP_URL }}
    steps:
      - name: Hỏi shop có thức không
        run: |
          set -u

          # No fallback address. There used to be one — the Render host this shop
          # ran on before it moved to a VPS — and it was the worst kind of default
          # for an uptime check: after the move it kept probing a host that answers
          # perfectly and is nobody's shop. Every run went green, and the monitor
          # was reporting on a server that had not existed in months. A domain
          # change that silently disarms the watch is worse than one that stops it.
          #
          # So the variable has to be set, and if it is not, this says so loudly
          # and exits 0. Failing here would be wrong for the same reason the PayPal
          # warning below does not fail: a scheduled job that is red for a reason
          # nobody can fix from the log trains everyone to ignore the log.
          if [ -z "${SHOP_URL:-}" ]; then
            echo "!! SHOP_URL chua duoc dat trong repository variables — bo the nay KHONG kiem tra gi ca."
            echo "!! Dat vars.SHOP_URL = https://<domain-cua-ban>/api/health trong Settings > Secrets and variables > Actions."
            exit 0
          fi

          url="$SHOP_URL"
          echo "GET $url"

          # A sleeping instance takes the connection and then needs thirty to sixty
          # seconds to answer, so the timeout is generous. Failing because it was slow
          # would be the worst kind of alert: one that arrives when the shop is fine.
          body="$(mktemp)"
          code=$(curl -s -o "$body" -w '%{http_code}' --max-time 90 "$url" || echo 000)
          echo "HTTP $code"
          cat "$body" 2>/dev/null || echo "(khong co noi dung)"
          echo

          # 200 is not the same as working. The endpoint answers 503 when a dependency
          # it depends on is down, and can answer 200 with ok:false. Reading the field
          # is what separates "the site replied" from "the shop is open".
          if [ "$code" != "200" ]; then
            echo "!! shop khong tra HTTP 200 — co the dang nguoi, dang that, hoac domain chua tro ve day"
            exit 1
          fi
          if ! grep -q '"ok":true' "$body"; then
            echo "!! tra HTTP 200 nhung ok=false — xem /api/health, co thieu R2 hoac database"
            exit 1
          fi
          rm -f "$body"

          # Worth noticing, not worth failing over. A warning that fails on something
          # the shop deliberately turned off trains people to ignore warnings.
          #
          # Read from the body captured above, not from /tmp/health.json. That path
          # was hardcoded and the file it named was never written and has since been
          # removed, so this branch had been reading a file that does not exist and
          # the warning had never once fired — the one thing it exists for.
          if grep -q '"paypalEnvironment":"unset' "$body"; then
            echo "!! PAYPAL_ENVIRONMENT chua duoc dat tren host nay — shop dang coi do la sandbox"
          fi
          echo "OK — shop dang thuc va bao khoe"